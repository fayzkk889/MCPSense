name: Action Self-Test
on: [workflow_dispatch]
permissions:
  contents: read
  security-events: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./
        with:
          target: ./testdata/compliant_server/manifest.json
          version: source
          offline: 'true'
          fail-on: high
