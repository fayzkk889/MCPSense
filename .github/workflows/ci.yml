name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.22.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod verify
      - run: go test ./... -count=1 -cover
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --test scripts/action.test.mjs npm/package.test.cjs npm/runtime.test.cjs internal/nodebridge/node.test.cjs
      - run: npm pack ./npm --dry-run --json --ignore-scripts
      - run: node scripts/release-verify.mjs
      - run: go build -ldflags="-X main.version=0.4.0" -o bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/mcpsense
      - run: node --test npm/package.test.cjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: node --test scripts/installers.test.mjs scripts/product.test.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: node scripts/npm-install-smoke.cjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Expanded product and frozen description evaluation
        run: node scripts/product-acceptance.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
          MCPSENSE_ACCEPTANCE_DIR: bin/product-ci
          MCPSENSE_VALIDATION: '1'
          MCPSENSE_INTENT_VALIDATION: '1'
          MCPSENSE_ENFORCE_PRODUCT: '1'
      - name: Beginner and experienced-user acceptance
        run: node scripts/persona-acceptance.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
          MCPSENSE_PERSONA_DIR: bin/persona-ci
          MCPSENSE_ENFORCE_PRODUCT: '1'
      - name: Live metadata product scenarios
        run: node scripts/product-live-acceptance.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
          MCPSENSE_ACCEPTANCE_DIR: bin/product-live-ci
      - name: Saved baseline metadata and compatibility journeys
        run: node scripts/baseline-acceptance.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
          MCPSENSE_BASELINE_DIR: bin/baseline-ci
      - name: Package pinning and diagnostic trust-boundary review
        run: node scripts/threat-review.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
          MCPSENSE_THREAT_DIR: bin/threat-review-ci
      - name: Dependency inventory beginner and expert journeys
        run: node scripts/dependency-acceptance.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
          MCPSENSE_DEPENDENCY_DIR: bin/dependency-ci
      - name: Fresh product descriptions and benign-context regression
        run: node scripts/fresh-product-retest.mjs
        env:
          MCPSENSE_TEST_BINARY: ${{ github.workspace }}/bin/mcpsense${{ runner.os == 'Windows' && '.exe' || '' }}
          MCPSENSE_FRESH_DIR: bin/fresh-product-ci
          MCPSENSE_FRESH_ENFORCE: '1'
  npm-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/build-npm-runtime.cjs
      - run: node scripts/release-verify.mjs --npm
      - name: Install actual tarball offline without Go or archive tools
        run: node scripts/npm-wasm-smoke.cjs
      - name: Native-equivalent product journeys through npm entrypoint
        run: node scripts/npm-product-suite.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npm-product-${{ matrix.os }}-node${{ matrix.node }}-${{ github.sha }}
          path: |
            bin/npm-install-wasm/
            bin/npm-product/
          retention-days: 7
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate one-scan JSON and SARIF with source binary
        uses: ./
        with:
          target: ./testdata/compliant_server/manifest.json
          version: source
          offline: 'true'
          sarif-upload: 'true'
          fail-on: high
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22.x'
      - uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84
        with:
          version: v1.64.8
  release-dry-run:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.3'
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          version: v2.18.3
          args: release --snapshot --skip=publish,announce,sign,sbom --timeout=10m
        env:
          GORELEASER_CURRENT_TAG: v0.4.0
      - name: Verify snapshot archives and exercise remediation evidence
        run: |
          (cd dist && sha256sum -c checksums.txt)
          ./dist/mcpsense_linux_amd64_v1/mcpsense --help
          bash docs/engineering/remediation-demo.sh "$PWD/dist/mcpsense_linux_amd64_v1/mcpsense"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcpsense-snapshot-${{ github.sha }}
          path: dist/
          retention-days: 7
