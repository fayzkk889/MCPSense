name: "MCPSense MCP Security Scanner"
description: "Scan MCP servers, configs, and agent skills for injection, CVEs, drift, and OWASP MCP Top 10 issues."
author: "fayzkk889"

branding:
  icon: "shield"
  color: "green"

inputs:
  target:
    description: "Target to scan: a file path, directory, or URL."
    required: true
  mode:
    description: "Scan mode: auto, static, live, manifest, config, skill"
    required: false
    default: "auto"
  severity:
    description: "Minimum severity to report: critical, high, medium, low, info"
    required: false
    default: "low"
  sarif-upload:
    description: "Upload SARIF results to GitHub Code Scanning (requires security-events: write permission)"
    required: false
    default: "true"
  fail-on:
    description: "Fail the workflow if findings at this severity or above are found: critical, high, medium, low, none"
    required: false
    default: "high"
  no-cve:
    description: "Skip CVE cross-referencing against OSV.dev"
    required: false
    default: "false"
  offline:
    description: "Disable all network calls (implies no-cve)"
    required: false
    default: "false"
  baseline:
    description: "Path to a committed baseline snapshot file for deterministic drift detection in CI"
    required: false
    default: ""
  version:
    description: "Version to download, or source to build this trusted Action revision (default)."
    required: false
    default: "source"

outputs:
  score:
    description: "The overall security score (0-100)"
    value: ${{ steps.scan.outputs.score }}
  findings-count:
    description: "Total number of findings"
    value: ${{ steps.scan.outputs.findings_count }}
  sarif-file:
    description: "Path to the SARIF output file"
    value: ${{ steps.scan.outputs.sarif_file }}

runs:
  using: "composite"
  steps:
    - name: Set up Go for trusted source build
      if: inputs.version == 'source'
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: "1.22.x"
        cache: false
    - name: Build or verify binary and run one scan
      id: scan
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        MODE: ${{ inputs.mode }}
        SEVERITY: ${{ inputs.severity }}
        FAIL_ON: ${{ inputs.fail-on }}
        NO_CVE: ${{ inputs.no-cve }}
        OFFLINE: ${{ inputs.offline }}
        BASELINE: ${{ inputs.baseline }}
        VERSION: ${{ inputs.version }}
        SARIF_UPLOAD: ${{ inputs.sarif-upload }}
      run: node "$GITHUB_ACTION_PATH/scripts/action.mjs"
    - name: Upload SARIF
      if: inputs.sarif-upload == 'true'
      uses: github/codeql-action/upload-sarif@793b778da9c9275a0f276522b27cb5fc14bba279
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_file }}
        category: mcpsense
    - name: Enforce findings threshold
      if: always() && steps.scan.outputs.threshold_failed == 'true'
      shell: bash
      run: |
        echo '::error::MCPSense findings exceed the configured threshold.'
        exit 1
